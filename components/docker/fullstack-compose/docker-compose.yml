# ============================================================================
# COMPONENTESXD — DOCKER COMPOSE FULLSTACK (APP + POSTGRES + REDIS)
# Archivo: components/docker/fullstack-compose/docker-compose.yml
# Coloca este archivo en la raíz de una aplicación con un Dockerfile compatible.
# DATABASE_URL debe apuntar al servicio postgres y usar la misma contraseña.
# ============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL con credenciales codificadas}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: componentesxd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d componentesxd"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

